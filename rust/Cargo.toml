[package]
name = "venera_backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.11.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md5 = "=0.8.1"
cookie = "=0.18.1"
time = "=0.3.44"
url = "2"
uuid = { version = "1", features = ["v4", "v1"] }
tempfile = "=3.20.0"
reqwest = { version = "=0.12.25", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli", "deflate", "stream", "socks"] }
tokio = { version = "=1.48.0", features = ["sync", "macros", "rt-multi-thread"] }
futures-util = "0.3"
rquickjs = { version = "=0.9.0", features = ["array-buffer", "bindgen"] }
scraper = "=0.24.0"
ego-tree = "=0.10.0"
aes = "=0.8.4"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
md_digest = { package = "md-5", version = "=0.10.6" }
hmac = "=0.12.1"
rsa = "=0.9.8"
base64 = "=0.22.1"
encoding_rs = "=0.8.35"
rand = "=0.8.5"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
sevenz-rust = "=0.6.1"
flate2 = "1"
roxmltree = "=0.20.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
